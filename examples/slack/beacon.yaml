# One webhook source, and every alert group posted to one Slack channel.
# docs/slack.md explains how to create the Slack app and where the values
# come from. Copy this directory, put your channel ID in place of
# C0123456789, and point Beacon at the copy:
#
#   BEACON_CONFIG_DIR=./my-config docker compose up --build
#
# The Slack credentials are read from the environment: BEACON_SLACK_BOT_TOKEN
# and BEACON_SLACK_SIGNING_SECRET.
#
# With this configuration alerts arrive in Slack and can be resolved there.
# Acknowledging and snoozing from Slack need a Beacon user whose Slack
# account is linked, and this file has no sign-in, so those two buttons
# answer with a note. examples/on-call has sign-in through an identity
# provider; docs/slack.md ("Who can act") says what a person needs.

sources:
  - name: default
    type: webhook
    token: {env: BEACON_SOURCE_TOKEN}

integrations:
  - name: slack
    type: slack
    slack:
      bot_token: {env: BEACON_SLACK_BOT_TOKEN}
      signing_secret: {env: BEACON_SLACK_SIGNING_SECRET}

# An alert group is posted to the channels named in the first step of its
# escalation policy. This is the only policy, so every group goes here; add
# rules to the routing block to send some alerts to other policies.
escalation_policies:
  - name: default
    steps:
      - notify:
          - channel: C0123456789
            integration: slack
        timeout: 5m

# Alerts with the same alertname share one message. It is posted ten seconds
# after the first of them arrives, and updated at most once a minute as
# alerts join or resolve. Without these lines the waits are 30s and 5m.
routing:
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  default:
    escalation_policy: default
