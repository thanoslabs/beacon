name: CI

on:
  push:
    branches:
      - main
  # No branch filter: runs for pull requests against any base branch,
  # including stacked pull requests that do not target main.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Committed files that are sensitive by name (environment files,
      # private keys, key stores) and private key material in any text file.
      - name: Check for sensitive files
        run: .github/scripts/check-sensitive-files.sh

      # Every document of every committed YAML file must parse.
      - name: Validate YAML files
        run: .github/scripts/check-yaml.sh

      # Both checks pass on a clean tree, which says little by itself: this
      # adds one offending file at a time to a copy and expects a failure.
      - name: Check that the two checks above can fail
        run: .github/scripts/test-checks.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Installs the Go and golangci-lint versions pinned in .tool-versions.
      - name: Install pinned tools
        uses: jdx/mise-action@v5.2.9

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # The web interface is embedded in the binary, so it is built first:
      # the binary that is tested is then the one that is released, and
      # TestEmbedded fails if the app is missing from it.
      - name: Build the web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build
        run: go build ./...

      - name: Lint
        run: golangci-lint run ./...

      # Database tests run against the Postgres version pinned in compose.yaml,
      # sign-in tests against the Dex pinned there, a real OpenID Connect
      # identity provider, and the tests of the email channel against the
      # Mailpit pinned there, a real SMTP server that delivers nothing.
      - name: Start Postgres, Dex and Mailpit
        run: docker compose up --detach --wait postgres dex mailpit

      - name: Test
        env:
          BEACON_TEST_DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon?sslmode=disable
          BEACON_TEST_OIDC_ISSUER: http://127.0.0.1:5556/dex
          BEACON_TEST_SMTP_ADDR: 127.0.0.1:1025
          BEACON_TEST_MAILPIT_URL: http://127.0.0.1:8025
        run: go test -race ./...

  # The web interface by itself: its types, its lint, its tests and its
  # build, with the Node version pinned in .tool-versions.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@v5.2.9

      - name: Install dependencies
        run: npm ci

      # src/api/schema.d.ts is generated from internal/api/openapi.yaml. A
      # change to the API that was not followed by `npm run generate` fails
      # here, and then the type check says what in the app it breaks.
      - name: Check the generated API types are up to date
        run: npm run generate:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # A real browser against the real binary, with the web interface embedded
  # in it: sign-in through Dex and everything a person does in the app, and
  # an accessibility check of each view.
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install pinned tools
        uses: jdx/mise-action@v5.2.9

      - name: Build the web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Beacon
        run: go build -o bin/beacon ./cmd/beacon

      - name: Start Postgres, Dex and Mailpit
        run: docker compose up --detach --wait postgres dex mailpit

      # The browser's version is fixed by the version of the test package.
      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test in the browser
        working-directory: web
        run: npx playwright test

      - name: Keep the report of a failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The Dockerfile cannot read .tool-versions, so the Go and Node
      # versions are written in both places. Fail if they drift apart.
      - name: Check the Dockerfile uses the pinned Go and Node versions
        run: |
          set -euo pipefail
          pinned="$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          if ! grep -Eq "^FROM .*golang:${pinned//./\\.}-" Dockerfile; then
            echo "::error file=Dockerfile::The build stage must use golang:${pinned}, as pinned in .tool-versions"
            exit 1
          fi
          pinned="$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"
          if ! grep -Eq "^FROM .*node:${pinned//./\\.}-" Dockerfile; then
            echo "::error file=Dockerfile::The stage that builds the web interface must use node:${pinned}, as pinned in .tool-versions"
            exit 1
          fi

      - name: Start Beacon and Postgres
        env:
          # A throwaway token, so the image can be shown to accept an alert.
          BEACON_SOURCE_TOKEN: ci-only-source-token-0123456789
        run: docker compose up --build --detach --wait

      - name: Check the endpoints and the image
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          # grep reads to the end here. With --quiet it would stop at the
          # first match and close the pipe while curl is still writing, which
          # fails the step now and then.
          curl --fail --silent --show-error http://127.0.0.1:8080/metrics | grep '^process_cpu_seconds_total ' > /dev/null
          # The image accepts an alert on the webhook and stores it.
          curl --fail --silent --show-error --request POST http://127.0.0.1:8080/api/v1/ingest/default \
            --header 'Authorization: Bearer ci-only-source-token-0123456789' \
            --data '{"labels": {"alertname": "CISmokeTest"}}' | grep '"result":"created"'
          # The image has the web interface in it: the page, with the
          # policy that keeps it to itself, and the script the page names.
          curl --fail --silent --show-error --dump-header page-headers http://127.0.0.1:8080/alerts > page.html
          grep '<div id="root">' page.html > /dev/null
          grep -i "^content-security-policy: default-src 'none'" page-headers > /dev/null
          script="$(grep -o '/assets/[^"]*\.js' page.html | head -n 1)"
          curl --fail --silent --show-error --dump-header script-headers --output /dev/null "http://127.0.0.1:8080${script}"
          grep -i '^cache-control: .*immutable' script-headers > /dev/null
          # An address of the API that is no route is not answered with it.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/no-such-thing)" = "401"
          # The container must not run as root.
          test "$(docker compose exec -T beacon id -u)" != "0"
          # A termination signal must lead to a clean exit.
          docker compose stop beacon
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet beacon)")" = "0"

      # A real Alertmanager and a real Grafana, the versions pinned in
      # compose.yaml, each deliver a firing and then a resolved notification
      # to Beacon. The loops wait for the alert to change, not for a fixed
      # time: both send after their group_wait and group_interval, and
      # Grafana takes up to a minute to start using its contact point.
      - name: Check that Alertmanager and Grafana deliver to Beacon
        env:
          BEACON_SOURCE_TOKEN: ci-only-source-token-0123456789
          BEACON_CONFIG_DIR: ./ci-sources
          COMPOSE_PROFILES: alertmanager,grafana
        run: |
          set -euo pipefail
          # Both sources in one configuration: the files of a directory are
          # read as one.
          mkdir ci-sources
          cp examples/alertmanager/beacon.yaml ci-sources/alertmanager.yaml
          cp examples/grafana/beacon.yaml ci-sources/grafana.yaml
          docker compose up --detach --wait

          amtool() { docker compose exec -T alertmanager amtool --alertmanager.url=http://localhost:9093 "$@"; }
          grafana_rule() {
            curl --fail --silent --show-error --output /dev/null --user admin:admin --request "$1" \
              --header 'Content-Type: application/json' --header 'X-Disable-Provenance: true' \
              --data @- "http://127.0.0.1:3000/api/v1/provisioning/alert-rules$2"
          }
          # alert_is <source> <status and severity> waits for the one alert
          # of the source to be in that state.
          alert_is() {
            for _ in $(seq 1 180); do
              state="$(docker compose exec -T postgres psql --username beacon --no-align --tuples-only --command \
                "SELECT a.status || ' ' || a.severity FROM alerts a JOIN sources s ON s.id = a.source_id WHERE s.name = '$1'")"
              if [ "$state" = "$2" ]; then return 0; fi
              sleep 1
            done
            echo "::error::the alert from $1 is '$state' in Beacon, want '$2'"
            return 1
          }

          amtool alert add AlertmanagerSmokeTest instance=ci severity=page
          grafana_rule POST "" < dev/grafana/demo-rule.json
          alert_is alertmanager "firing critical"
          alert_is grafana "firing critical"

          amtool alert add AlertmanagerSmokeTest instance=ci severity=page --end="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          jq '.isPaused = true' dev/grafana/demo-rule.json | grafana_rule PUT /beacon-demo
          alert_is alertmanager "resolved critical"
          alert_is grafana "resolved critical"
          # The Grafana alert kept its dashboard and panel links.
          links="$(docker compose exec -T postgres psql --username beacon --no-align --tuples-only --command \
            "SELECT count(*) FROM alerts WHERE links ? 'generator' AND links ? 'dashboard' AND links ? 'panel'")"
          test "$links" = "1"

      - name: Show logs
        if: always()
        env:
          COMPOSE_PROFILES: alertmanager,grafana
        run: docker compose logs --no-color
