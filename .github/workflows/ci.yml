name: CI

on:
  push:
    branches:
      - main
  # No branch filter: runs for pull requests against any base branch,
  # including stacked pull requests that do not target main.
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          # Fail if .env, secrets, or private keys are committed
          if git grep -l "\.env\|PRIVATE_KEY\|AWS_SECRET" --cached 2>/dev/null; then
            echo "Error: sensitive files committed"
            exit 1
          fi

      - name: Validate YAML files
        run: |
          for f in $(find . -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -v node_modules); do
            python3 -c "import yaml, sys; yaml.safe_load(open('$f'))" 2>/dev/null || echo "Invalid YAML: $f"
          done

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Installs the Go and golangci-lint versions pinned in .tool-versions.
      - name: Install pinned tools
        uses: jdx/mise-action@v5.2.9

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Lint
        run: golangci-lint run ./...

      # Database tests run against the Postgres version pinned in compose.yaml,
      # and sign-in tests against the Dex pinned there, a real OpenID Connect
      # identity provider.
      - name: Start Postgres and Dex
        run: docker compose up --detach --wait postgres dex

      - name: Test
        env:
          BEACON_TEST_DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon?sslmode=disable
          BEACON_TEST_OIDC_ISSUER: http://127.0.0.1:5556/dex
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # The Dockerfile cannot read .tool-versions, so the Go version is
      # written in both places. Fail if they drift apart.
      - name: Check the Dockerfile uses the pinned Go version
        run: |
          set -euo pipefail
          pinned="$(awk '$1 == "golang" { print $2 }' .tool-versions)"
          if ! grep -Eq "^FROM .*golang:${pinned//./\\.}-" Dockerfile; then
            echo "::error file=Dockerfile::The build stage must use golang:${pinned}, as pinned in .tool-versions"
            exit 1
          fi

      - name: Start Beacon and Postgres
        env:
          # A throwaway token, so the image can be shown to accept an alert.
          BEACON_SOURCE_TOKEN: ci-only-source-token-0123456789
        run: docker compose up --build --detach --wait

      - name: Check the endpoints and the image
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          # grep reads to the end here. With --quiet it would stop at the
          # first match and close the pipe while curl is still writing, which
          # fails the step now and then.
          curl --fail --silent --show-error http://127.0.0.1:8080/metrics | grep '^process_cpu_seconds_total ' > /dev/null
          # The image accepts an alert on the webhook and stores it.
          curl --fail --silent --show-error --request POST http://127.0.0.1:8080/api/v1/ingest/default \
            --header 'Authorization: Bearer ci-only-source-token-0123456789' \
            --data '{"labels": {"alertname": "CISmokeTest"}}' | grep '"result":"created"'
          # The container must not run as root.
          test "$(docker compose exec -T beacon id -u)" != "0"
          # A termination signal must lead to a clean exit.
          docker compose stop beacon
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet beacon)")" = "0"

      # A real Alertmanager, the version pinned in compose.yaml, delivers a
      # firing and then a resolved notification to Beacon. The loops wait for
      # the alert to change, not for a fixed time: Alertmanager sends after
      # its group_wait and group_interval.
      - name: Check that Alertmanager delivers to Beacon
        env:
          BEACON_SOURCE_TOKEN: ci-only-source-token-0123456789
          BEACON_CONFIG_DIR: ./examples/alertmanager
          COMPOSE_PROFILES: alertmanager
        run: |
          set -euo pipefail
          docker compose up --detach --wait
          amtool() { docker compose exec -T alertmanager amtool --alertmanager.url=http://localhost:9093 "$@"; }
          alert_is() {
            for _ in $(seq 1 120); do
              state="$(docker compose exec -T postgres psql --username beacon --no-align --tuples-only \
                --command "SELECT status || ' ' || severity FROM alerts WHERE labels->>'alertname' = 'CISmokeTest'")"
              if [ "$state" = "$1" ]; then return 0; fi
              sleep 1
            done
            echo "::error::the alert is '$state' in Beacon, want '$1'"
            return 1
          }
          amtool alert add CISmokeTest instance=ci severity=page
          alert_is "firing critical"
          amtool alert add CISmokeTest instance=ci severity=page --end="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          alert_is "resolved critical"

      - name: Show logs
        if: always()
        env:
          COMPOSE_PROFILES: alertmanager
        run: docker compose logs --no-color
