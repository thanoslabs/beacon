# Beacon and its only dependency, Postgres. docs/quickstart.md walks through
# a first run.
#
#   docker compose up --build        # build Beacon from this checkout and start both
#   docker compose up -d --wait postgres   # only Postgres, for development and tests
#
# The credentials below are for local use only. Change them before exposing
# either service.
services:
  beacon:
    build:
      context: .
    environment:
      BEACON_DATABASE_URL: postgres://beacon:beacon@postgres:5432/beacon?sslmode=disable
      BEACON_CONFIG: /etc/beacon
      # Token of the webhook source in the mounted configuration. The default
      # is for local use only; set your own. See docs/webhook.md.
      BEACON_SOURCE_TOKEN: ${BEACON_SOURCE_TOKEN:-local-development-token}
      # Hash of the password of the bootstrap admin, with which the
      # quickstart signs in to the web interface. The default is the hash of
      # "local-development-password", which everyone knows: it is for trying
      # Beacon out on this machine only. Make your own with
      # `beacon hash-password`, and mind that Compose reads a $ in a value
      # unless it is written $$. See docs/access.md.
      BEACON_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BEACON_BOOTSTRAP_ADMIN_PASSWORD_HASH:-$$2a$$12$$AxLH.cSYxO4J7BQSRKiZceiSKU7VLV8.WPzpFtwpkCgeMoYxt8AiW}
      # Slack app credentials, read only by a configuration that has a Slack
      # integration, such as examples/slack. See docs/slack.md.
      BEACON_SLACK_BOT_TOKEN: ${BEACON_SLACK_BOT_TOKEN:-}
      BEACON_SLACK_SIGNING_SECRET: ${BEACON_SLACK_SIGNING_SECRET:-}
      # Bot token of the Discord application, read only by a configuration
      # that has a Discord integration, such as examples/discord. See
      # docs/discord.md.
      BEACON_DISCORD_BOT_TOKEN: ${BEACON_DISCORD_BOT_TOKEN:-}
      # Password of the SMTP account, read only by a configuration that has
      # an email integration, such as examples/email. See docs/email.md.
      BEACON_SMTP_PASSWORD: ${BEACON_SMTP_PASSWORD:-}
      # Key that signs outbound webhooks, read only by a configuration that
      # has one, such as examples/outbound-webhook. See
      # docs/outbound-webhook.md.
      BEACON_WEBHOOK_SIGNING_SECRET: ${BEACON_WEBHOOK_SIGNING_SECRET:-}
    volumes:
      # The configuration: a directory of YAML files. See docs/configuration.md.
      - ${BEACON_CONFIG_DIR:-./examples/quickstart}:/etc/beacon:ro
    ports:
      - "127.0.0.1:${BEACON_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    ports:
      - "127.0.0.1:${BEACON_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username beacon --dbname beacon"]
      interval: 2s
      timeout: 5s
      retries: 30

  # An OpenID Connect identity provider for development and for the sign-in
  # tests. It is not started by `docker compose up`; ask for it by name:
  #
  #   docker compose up -d --wait dex
  #
  # Its users and client are in dev/dex/config.yaml. See docs/access.md.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    profiles: ["oidc"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:${BEACON_DEX_PORT:-5556}:5556"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 2s
      timeout: 3s
      retries: 30

  # An SMTP server that keeps every message it is sent and delivers none,
  # for development and for the tests of the email channel. It is not
  # started by `docker compose up`; ask for it by name:
  #
  #   docker compose up -d --wait mailpit
  #
  # Read the messages at http://localhost:8025. It takes mail without TLS,
  # from the user in dev/mailpit/auth only. See docs/email.md.
  mailpit:
    image: axllent/mailpit:v1.33.1
    profiles: ["mail"]
    environment:
      MP_SMTP_AUTH_FILE: /etc/mailpit/auth
      # The tests reach it on this machine, where a password may travel
      # without TLS.
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - ./dev/mailpit/auth:/etc/mailpit/auth:ro
    ports:
      - "127.0.0.1:${BEACON_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${BEACON_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # An Alertmanager that sends its notifications to Beacon, for development
  # and for trying the Alertmanager source out. It is not started by
  # `docker compose up`; ask for it with the profile, and give Beacon a
  # configuration that has the source:
  #
  #   BEACON_CONFIG_DIR=./examples/alertmanager docker compose --profile alertmanager up --build
  #
  # Its configuration is dev/alertmanager/alertmanager.yml. See
  # docs/alertmanager.md.
  alertmanager:
    image: prom/alertmanager:v0.35.0
    profiles: ["alertmanager"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./dev/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    configs:
      - source: source-token
        target: /etc/alertmanager/beacon-token
    ports:
      - "127.0.0.1:${BEACON_ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A Grafana whose alerting sends its notifications to Beacon, for
  # development and for trying the Grafana source out. It is not started by
  # `docker compose up`; ask for it with the profile, and give Beacon a
  # configuration that has the source:
  #
  #   BEACON_CONFIG_DIR=./examples/grafana docker compose --profile grafana up --build
  #
  # Its contact point and notification policy are in dev/grafana, and so is
  # the Beacon dashboard, which reads the Prometheus below. Sign in with
  # Grafana's initial account, admin and admin. See docs/grafana.md.
  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["grafana"]
    environment:
      # Read by the provisioned contact point.
      BEACON_SOURCE_TOKEN: ${BEACON_SOURCE_TOKEN:-local-development-token}
      # The address that the links in notifications start with.
      GF_SERVER_ROOT_URL: http://localhost:${BEACON_GRAFANA_PORT:-3000}/
    volumes:
      - ./dev/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./dev/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dev/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dev/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${BEACON_GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 60

  # A Prometheus that scrapes Beacon's own metrics and evaluates the example
  # alerting rules in dev/prometheus, so that the Beacon dashboard of the
  # Grafana above has data. It starts with the same profile. See
  # docs/metrics.md.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["grafana"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
    volumes:
      - ./dev/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${BEACON_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

# The token of Beacon's source, as a file for the senders that read their
# credentials from one.
configs:
  source-token:
    content: ${BEACON_SOURCE_TOKEN:-local-development-token}

volumes:
  postgres-data:
