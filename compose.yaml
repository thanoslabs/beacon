# Development services for Beacon. Postgres is the only dependency.
#
#   docker compose up -d --wait postgres
#
# The credentials below are for local development only.
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    ports:
      - "127.0.0.1:${BEACON_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username beacon --dbname beacon"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
