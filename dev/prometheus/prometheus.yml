# The Prometheus of the Compose profile "grafana": it scrapes the Beacon of
# compose.yaml and evaluates the example alerting rules, so that the Beacon
# dashboard in Grafana has something to show. It sends its alerts nowhere.
# See docs/metrics.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/beacon-alerts.yml

scrape_configs:
  - job_name: beacon
    static_configs:
      - targets: ["beacon:8080"]
