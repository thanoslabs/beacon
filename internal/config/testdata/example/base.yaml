# Sources and integrations shared by every team.

sources:
  - name: prod-alertmanager
    type: alertmanager
    token: {env: BEACON_SOURCE_PROD_ALERTMANAGER_TOKEN}
    labels:
      environment: production
    severity:
      label: severity
      mapping:
        page: critical
        critical: critical
        warning: warning
      default: warning

  - name: grafana
    type: grafana
    token:
      file: secrets/grafana-source-token

integrations:
  - name: slack
    type: slack
    slack:
      bot_token: {env: BEACON_SLACK_BOT_TOKEN}
      signing_secret: {env: BEACON_SLACK_SIGNING_SECRET}

  - name: email
    type: email
    email:
      host: smtp.example.com
      port: 587
      username: beacon
      password: {env: BEACON_SMTP_PASSWORD}
      from: beacon@example.com
      tls: starttls

  - name: discord
    type: discord
    discord:
      bot_token: {env: BEACON_DISCORD_BOT_TOKEN}
      public_key: 5f1c0c8e7a9b4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e
      application_id: "1234567890123456789"

  - name: ticketing
    type: webhook
    webhook:
      url: https://tickets.example.com/hooks/beacon
      signing_secret: {env: BEACON_TICKETING_SIGNING_SECRET}
      headers:
        X-Team: platform
        Authorization: {env: BEACON_TICKETING_AUTHORIZATION}

routing:
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  default:
    team: platform
    escalation_policy: platform-default
  rules:
    - name: platform-critical
      match:
        team: platform
      match_re:
        severity: critical|page
      team: platform
      escalation_policy: platform-default
      group_wait: 10s

auth:
  public_url: https://beacon.example.com
  session_lifetime: 8h
  oidc:
    issuer: https://idp.example.com
    client_id: beacon
    client_secret: {env: BEACON_OIDC_CLIENT_SECRET}
    scopes: [openid, profile, email, groups]
    groups_claim: groups
  roles:
    admin: [beacon-admins]
    member: [beacon-users, platform-engineers]
