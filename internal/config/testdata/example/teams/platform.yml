teams:
  - name: platform
    display_name: Platform
    members:
      - ada@example.com
      - grace@example.com
      - linus@example.com
    groups:
      - platform-engineers

schedules:
  - name: platform-primary
    team: platform
    time_zone: Europe/London
    rotation:
      members:
        - ada@example.com
        - grace@example.com
        - linus@example.com
      shift_length: 1w
      handoff:
        day: monday
        time: "09:00"
    effective_from: 2026-12-07T09:00:00Z

escalation_policies:
  - name: platform-default
    repeat: 2
    steps:
      - notify:
          - schedule: platform-primary
          - channel: "#platform-alerts"
            integration: slack
        timeout: 5m
      - notify:
          - team: platform
        timeout: 10m
      - notify:
          - user: ada@example.com
            via: [email]
        timeout: 15m
